name: checks
on: [push, pull_request]
permissions: {contents: read}
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts (syntax + shellcheck)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          for f in kada bootstrap.sh scripts/*.sh config/hypr/scripts/*.sh; do bash -n "$f"; done
          shellcheck -S error kada scripts/*.sh
      - name: Python (compiles)
        run: python3 -m compileall -q config scripts tests
      - name: Installer menu (dry runs)
        run: python3 -m unittest tests/test_kada.py -v
