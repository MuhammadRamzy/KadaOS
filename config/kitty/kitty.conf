# generated by scripts/theme.py — Graphite
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0
# ligatures on everywhere except under the cursor (so you can edit them)
disable_ligatures cursor
modify_font      cell_height 112%
adjust_line_height 0
text_composition_strategy platform
background_opacity 0.94
background_blur 1
window_padding_width 14 16
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.0
hide_window_decorations yes
cursor_shape beam
cursor_beam_thickness 1.6
cursor_trail 3
cursor_blink_interval 0
scrollback_lines 50000
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 2.0
url_style curly
detect_urls yes
show_hyperlink_targets yes
allow_remote_control yes
listen_on unix:@mykitty
shell_integration enabled
# tabs: slanted, index + title, powerline feel
tab_bar_edge top
tab_bar_style slant
tab_bar_align left
tab_bar_min_tabs 1
tab_title_template "{fmt.fg._5c5c64}{index}{fmt.fg.default} {title}"
active_tab_title_template "{index} {title}"
active_tab_font_style bold
foreground #f2f2f5
background #17171a
selection_foreground #0e0e10
selection_background #5b9cff
cursor #5b9cff
cursor_text_color #0e0e10
url_color #9ec2ff
active_border_color #5b9cff
inactive_border_color #38383e
active_tab_foreground #0e0e10
active_tab_background #5b9cff
inactive_tab_foreground #c4c4ca
inactive_tab_background #212125
tab_bar_background #0e0e10
# quick layout + font-size keys
map ctrl+shift+enter new_window
map ctrl+shift+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map ctrl+shift+f show_scrollback
color0 #2c2c31
color1 #ff6b62
color2 #5fd38a
color3 #ffab4d
color4 #5b9cff
color5 #b48cff
color6 #5ed1d1
color7 #c4c4ca
color8 #5c5c64
color9 #ff8f88
color10 #86e3a8
color11 #ffc47f
color12 #86b6ff
color13 #cbb0ff
color14 #8ae6e6
color15 #f2f2f5
