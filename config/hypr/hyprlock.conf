# generated by scripts/theme.py (Graphite) — a big 12-hour clock over the KadaOS backdrop
general {
    hide_cursor = true
    ignore_empty_input = true
}
background {
    monitor =
    path = /home/USER/.local/share/myos/kadaos-backdrop.jpg
    color = rgba(0e0e10ff)
    blur_passes = 0
}
# the big clock, Apple style: huge numerals over the backdrop, the date above them
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 20
    font_family = Adwaita Sans Medium
    color = rgba(c4c4caff)
    position = 0, -96
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    font_size = 168
    font_family = Adwaita Sans Bold
    color = rgba(f2f2f5ee)
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(00000066)
    position = 0, -128
    halign = center
    valign = top
}
# you, then the password, low on the screen
label {
    monitor =
    text = cmd[update:0] n=$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1); echo "${n:-$USER}"
    font_size = 15
    font_family = Adwaita Sans Medium
    color = rgba(f2f2f5ff)
    position = 0, 236
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 340, 50
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    outer_color = rgba(5b9cffe6)
    inner_color = rgba(17171aeb)
    font_color = rgba(f2f2f5ff)
    font_family = Adwaita Sans
    check_color = rgba(5b9cffff)
    fail_color = rgba(ff6b62ff)
    capslock_color = rgba(ffab4dff)
    fade_on_empty = false
    placeholder_text = <span foreground="##8b8b92">Password</span>
    fail_text = <span foreground="##ff6b62">Try again</span>
    rounding = 12
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000073)
    position = 0, 164
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:1000] [ "$(cat /sys/class/leds/*::capslock/brightness 2>/dev/null | sort -r | head -1)" = 1 ] && echo "Caps Lock is on"
    font_size = 12
    font_family = Adwaita Sans
    color = rgba(ffab4dff)
    position = 0, 128
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/lock-status.sh
    font_size = 12
    font_family = Adwaita Sans
    color = rgba(c4c4caff)
    position = 0, 40
    halign = center
    valign = bottom
}
