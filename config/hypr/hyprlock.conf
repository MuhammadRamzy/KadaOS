# generated by scripts/theme.py (Graphite) — identity-forward, 12-hour clock
general {
    hide_cursor = true
    ignore_empty_input = true
}
background {
    monitor =
    path = /home/USER/Pictures/Wallpapers/graphite.png
    color = rgba(0e0e10ff)
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
    vibrancy = 0.15
}
# clock in the corner, like a phone — not the tired dead-centre clock
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M<span font_size='26pt' foreground='##c4c4ca'> %p</span>"
    font_size = 72
    font_family = Adwaita Sans Bold
    color = rgba(f2f2f5ff)
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(00000055)
    position = 60, -55
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 16
    font_family = Adwaita Sans
    color = rgba(c4c4caff)
    position = 64, -150
    halign = left
    valign = top
}
# the hero: the MR wordmark
image {
    monitor =
    path = /home/USER/.local/share/myos/lock-hero.png
    size = 300
    rounding = 0
    border_size = 0
    position = 0, 110
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); if [ $h -lt 5 ]; then echo "Good night"; elif [ $h -lt 12 ]; then echo "Good morning"; elif [ $h -lt 17 ]; then echo "Good afternoon"; else echo "Good evening"; fi
    font_size = 24
    font_family = Adwaita Sans
    color = rgba(f2f2f5ff)
    position = 0, -40
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] n=$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1); echo "${n:-$USER}"
    font_size = 14
    font_family = Adwaita Sans
    color = rgba(8b8b92ff)
    position = 0, -78
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(ffffff22)
    inner_color = rgba(17171abb)
    font_color = rgba(f2f2f5ff)
    font_family = Adwaita Sans
    check_color = rgba(5b9cffff)
    fail_color = rgba(ff6b62ff)
    capslock_color = rgba(ffab4dff)
    fade_on_empty = false
    placeholder_text = <span foreground="##8b8b92">Enter password to unlock</span>
    fail_text = <span foreground="##ff6b62">Try again</span>
    rounding = 24
    position = 0, -150
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] [ "$(cat /sys/class/leds/*::capslock/brightness 2>/dev/null | sort -r | head -1)" = 1 ] && echo "Caps Lock is on"
    font_size = 12
    font_family = Adwaita Sans
    color = rgba(ffab4dff)
    position = 0, -205
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/lock-status.sh
    font_size = 12
    font_family = Adwaita Sans
    color = rgba(c4c4caff)
    position = 0, 40
    halign = center
    valign = bottom
}
image {
    monitor =
    path = /home/USER/.config/hypr/kadaos-mark.svg
    size = 26
    rounding = 0
    border_size = 0
    position = -56, 40
    halign = right
    valign = bottom
}
