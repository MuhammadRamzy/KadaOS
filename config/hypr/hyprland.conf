# ─── KadaOS Hyprland (0.53) ─── Catppuccin Mocha · iGPU-first hybrid laptop ───
# Split configs: hyprpaper.conf, hypridle.conf, hyprlock.conf. Cheatsheet: Super+F1 or `helpme`.

monitor = eDP-1, highrr, 0x0, 1          # laptop panel at its best refresh rate (system-adapt drops to 60 Hz on battery)
monitor = , preferred, auto, 1          # any external display: auto-place right

$mod      = SUPER
$terminal = ptyxis --new-window     # same terminal + profile as Ubuntu
$quickterm = kitty --class kitty-scratch
$launcher = ~/.config/hypr/scripts/launcher.sh
$files    = nautilus
$scripts  = ~/.config/hypr/scripts

# Render on Intel iGPU (card1), NVIDIA second for external screens. Skips the boot framebuffer (card0)
# that caused ghost cursors. Symlinks are created by phase8b (colons in /dev/dri paths break this var).
env = AQ_DRM_DEVICES,/home/USER/.config/hypr/gpu-intel:/home/USER/.config/hypr/gpu-nvidia

# ── Environment (iGPU renders the desktop; use `nvrun <app>` for the RTX 5050) ──
# user tool dirs (claude, codex, gemini, fai, uv, bun, cargo…) — the login session PATH lacks them
env = PATH,/home/USER/.local/bin:/home/USER/.local/share/fnm/aliases/default/bin:/home/USER/.bun/bin:/home/USER/.cargo/bin:/home/USER/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Yaru          # Ubuntu's cursor; gnome-sync.sh follows Settings
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = SDL_VIDEODRIVER,wayland,x11

# ── Autostart ──
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = sh -c '[ "$(cat ~/.config/hypr/wallpaper-mode 2>/dev/null)" = image ] && hyprpaper'   # default: plain black
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11   # same saved passwords as Ubuntu
exec-once = ~/.config/hypr/scripts/gnome-sync.sh   # Ubuntu Settings -> Hyprland (mouse speed, cursor, wallpaper…)
exec-once = ~/.config/hypr/scripts/cursor-reset.sh   # clears the frozen login-screen pointer (ghost cursor)
exec-once = sh -c 'command -v swayosd-server >/dev/null && swayosd-server'
exec-once = ~/.config/hypr/scripts/bar.sh start   # top bar in the saved mode: on / off / auto-hide
exec-once = systemctl --user start swaync
exec-once = sh -c 'command -v kdeconnectd >/dev/null && exec kdeconnectd'   # phone link (docs/PHONE.md); `phone` revives it over D-Bus if it dies
exec-once = sh -c 'systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE; systemctl --user is-enabled --quiet myos-hydration.service && systemctl --user restart myos-hydration.service'
exec-once = systemctl --user start system-adapt   # power/focus/health automation (config/ai)   # single instance, managed by systemd (see config/systemd)
exec-once = hypridle
exec-once = sh -c 'command -v blueman-applet >/dev/null && blueman-applet'   # pairing prompts; tray icon disabled (StatusIcon plugins off)
exec-once = sh -c 'systemctl --user start hyprpolkitagent 2>/dev/null || for a in /usr/lib/hyprpolkitagent/hyprpolkitagent /usr/libexec/hyprpolkitagent /usr/lib/polkit-kde-authentication-agent-1; do [ -x "$a" ] && exec "$a"; done'
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = sh -c 'command -v udiskie >/dev/null && udiskie --tray'

# ── Input ──
input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1               # focus follows the pointer (hovering a window activates it)
    float_switch_override_focus = 0  # popups keep focus through stay_focused below, not through this
    sensitivity = 0.6               # overridden live by Ubuntu Settings > Mouse (gnome-sync.sh)
    repeat_rate = 40
    repeat_delay = 250
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
        scroll_factor = 0.6
    }
}
gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace

# ── Look ──
general {
    gaps_in = 4
    gaps_out = 6, 8, 8, 8
    border_size = 2
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}
decoration {
    rounding = 12
    rounding_power = 2.4          # squircle-like corners
    active_opacity = 1.0
    inactive_opacity = 1.0        # inactive text stays fully legible; dimming marks focus
    dim_inactive = true
    dim_strength = 0.06
    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.02
        vibrancy = 0.2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 24
        render_power = 4
        offset = 0, 4
    }
}
animations {
    enabled = true
    # short, no overshoot (~150–300 ms); speed unit is 100 ms
    bezier = ease, 0.22, 1, 0.36, 1
    bezier = out, 0.16, 1, 0.3, 1
    animation = windows,    1, 2.6, out, popin 94%
    animation = windowsOut, 1, 1.8, ease, popin 94%
    animation = fade,       1, 2.2, ease
    animation = border,     1, 3, ease
    animation = workspaces, 1, 3, out, slide
    animation = layers,     1, 2, out, fade
    animation = layersIn,   1, 2.8, out, fade
    animation = layersOut,  1, 2.2, ease, fade
}
dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}
master { new_status = master }
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(000000)   # plain black desktop (Super+W to pick an image instead)
    disable_hyprland_guiutils_check = true   # Ubuntu ships hyprland-qtutils (installed) instead of guiutils
    vfr = true                      # saves battery: redraw only when needed
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
    enable_swallow = true
    swallow_regex = ^(kitty|org.gnome.Ptyxis)$
}
xwayland { force_zero_scaling = true }
cursor {
    no_hardware_cursors = 1       # fixes the double/ghost cursor on Intel+NVIDIA laptops
    hide_on_key_press = true
    inactive_timeout = 5
}
debug { disable_logs = true }       # the default log grows to hundreds of MB of libinput spam

# ── Window & layer rules (0.53 syntax) ──
# Dialog-type apps float centered (class names checked with `hyprctl clients`)
$floaters = ^(org\.pulseaudio\.pavucontrol|pavucontrol|nm-connection-editor|blueman-manager|\.blueman-manager-wrapped|org\.gnome\.Calculator|org\.gnome\.Settings|swappy|xdg-desktop-portal-gtk|org\.gnome\.FileRoller|gnome-system-monitor|org\.gnome\.SystemMonitor|nwg-displays|qt6ct|nwg-look)$
windowrule = float on, match:class $floaters
# Pad control (tablet-control.py): scrcpy's input window is an invisible 3 px strip on the right edge
windowrule = float on, match:title ^(Pad control)$
windowrule = pin on, match:title ^(Pad control)$
windowrule = size 3 (monitor_h), match:title ^(Pad control)$
windowrule = move (monitor_w-3) 0, match:title ^(Pad control)$
windowrule = border_size 0, match:title ^(Pad control)$
windowrule = rounding 0, match:title ^(Pad control)$
windowrule = no_shadow on, match:title ^(Pad control)$
windowrule = no_anim on, match:title ^(Pad control)$
windowrule = no_initial_focus on, match:title ^(Pad control)$
windowrule = opacity 0.01, match:title ^(Pad control)$
windowrule = center on, match:class $floaters
windowrule = size 1000 680, match:class ^(org\.gnome\.Settings|org\.pulseaudio\.pavucontrol|pavucontrol|blueman-manager|nm-connection-editor|gnome-system-monitor|org\.gnome\.SystemMonitor)$
windowrule = float on, match:title ^(Open File|Save File|Save As|Open Folder|File Upload|Select a File|Choose Files?)(.*)$
windowrule = center on, match:title ^(Open File|Save File|Save As|Open Folder|File Upload|Select a File|Choose Files?)(.*)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = keep_aspect_ratio on, match:title ^(Picture-in-Picture)$
windowrule = idle_inhibit fullscreen, match:class .*
windowrule = float on, match:class ^(fai-answer)$
windowrule = size 960 640, match:class ^(fai-answer)$
windowrule = center on, match:class ^(fai-answer)$
# Quick Settings panels: floating popovers that stay put across workspaces (the app positions itself top-right)
windowrule = float on, match:class ^(org\.myos\.Panel)$
windowrule = pin on, match:class ^(org\.myos\.Panel)$
# Password prompts (polkit): a centered system sheet that dims the screen and keeps keyboard focus
windowrule = float on, match:class ^(hyprpolkitagent)$
windowrule = center on, match:class ^(hyprpolkitagent)$
windowrule = pin on, match:class ^(hyprpolkitagent)$
windowrule = dim_around on, match:class ^(hyprpolkitagent)$
windowrule = stay_focused on, match:class ^(hyprpolkitagent)$
# AI assistant: a panel that pops up above the floating orb (bottom-right), on every workspace
windowrule = float on, match:class ^(org\.myos\.Chat)$
windowrule = pin on, match:class ^(org\.myos\.Chat)$
windowrule = size 420 760, match:class ^(org\.myos\.Chat)$
windowrule = move (monitor_w-442) (monitor_h-852), match:class ^(org\.myos\.Chat)$
windowrule = animation popin 90%, match:class ^(org\.myos\.Chat)$
layerrule = no_anim on, match:namespace ^(myos-orb)$
layerrule = animation slide top, match:namespace ^(waybar)$     # the top bar glides down from the edge (auto mode)
windowrule = float on, match:class ^(org\.myos\.Pick|org\.myos\.FileActions|org\.myos\.Shortcuts|org\.myos\.Run)$
# Popups that close on focus loss keep focus while the pointer wanders; a click outside closes them (popup-dismiss.sh).
windowrule = stay_focused on, match:class ^(org\.myos\.Panel|org\.myos\.Pick|org\.myos\.Run)$
windowrule = center on, match:class ^(org\.myos\.Pick|org\.myos\.FileActions|org\.myos\.Shortcuts|org\.myos\.Run)$
windowrule = float on, match:class ^(kitty-scratch)$
windowrule = size 1344 720, match:class ^(kitty-scratch)$
windowrule = center on, match:class ^(kitty-scratch)$
# dropdown (quake) terminal: full-width strip from the top
windowrule = float on, match:class ^(kitty-dropdown)$
windowrule = size 1872 560, match:class ^(kitty-dropdown)$
windowrule = move 24 6, match:class ^(kitty-dropdown)$
layerrule = blur on, match:namespace ^(waybar|wofi|rofi|swayosd|swaync-control-center|swaync-notification-window|logout_dialog)$
layerrule = ignore_alpha 0.3, match:namespace ^(waybar|wofi|rofi|swayosd|swaync-control-center|swaync-notification-window)$

