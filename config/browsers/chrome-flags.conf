# Extra Chrome flags, one per line (# comments allowed). Read by ~/.local/bin/google-chrome-stable on every launch.
# Edit and restart Chrome to apply. Check what's active at chrome://version (Command Line) and chrome://gpu.
--ozone-platform-hint=auto
# two-finger swipe left/right = back/forward
# hardware video decode/encode on the Intel iGPU (needs: sudo apt install intel-media-va-driver-non-free)
--enable-features=TouchpadOverscrollHistoryNavigation,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder
