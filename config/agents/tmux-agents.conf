# Agent sessions (sourced from ~/.tmux.conf by install-agents.sh)
set -g set-titles on
set -g set-titles-string "agents · #{s/^ag-//:session_name} · #W"
set -g monitor-bell on
set -g status-style "bg=#0b1624,fg=#a9c4d6"
set -g status-left "#[fg=#060b13,bg=#e0b865,bold]  #{s/^ag-//:session_name} #[default] "
set -g status-left-length 40
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#e0b865,bold] #I #W "
set -g status-right "#[fg=#7f98ab]Ctrl+b n/p switch · Ctrl+b d detach "
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
